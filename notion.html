:root {

  --border: #333; --hover: #2d2d2d;

* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:'Segoe UI', system-ui, sans-serif; min-height:100vh; display:flex; }
.sidebar { width:260px; min-width:260px; background:var(--bg2); border-left:1px solid var(--border); padding:16px 0; display:flex; flex-direction:column; }
.sidebar-title { padding:4px 16px 16px; font-weight:800; font-size:16px; }
.sidebar-nav { flex:1; }
.sidebar-item { display:flex; align-items:center; gap:10px; padding:10px 18px; cursor:pointer; font-size:15px; color:var(--text2); transition:.15s; border:none; background:none; width:100%; text-align:right; font-family:inherit; }
.sidebar-item:hover { background:var(--hover); color:var(--text); }
.sidebar-item.active { background:var(--bg3); color:var(--text); font-weight:600; }
.sidebar-icon { font-size:18px; }
.sidebar-badge { margin-right:auto; background:var(--red); color:#fff; padding:2px 10px; border-radius:10px; font-size:12px; font-weight:700; }
.sidebar-footer { padding:12px 18px; border-top:1px solid var(--border); font-size:13px; color:var(--text2); line-height:1.8; }
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.topbar { display:flex; align-items:center; gap:12px; padding:12px 24px; border-bottom:1px solid var(--border); background:var(--bg); }
.topbar-title { font-size:18px; font-weight:700; }
.topbar-actions { margin-right:auto; display:flex; gap:8px; }
.btn { padding:8px 18px; border-radius:6px; border:1px solid var(--border); background:var(--bg3); color:var(--text); cursor:pointer; font-size:14px; font-family:inherit; transition:.15s; white-space:nowrap; }
.btn:hover { background:var(--hover); }
.btn-primary { background:var(--accent); border-color:var(--accent); color:#fff; }
.btn-primary:hover { background:#4a8ac4; }
.content { flex:1; overflow-y:auto; padding:24px; }
.stats-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:24px; }
.stat-card { background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:20px; }
.stat-label { font-size:13px; color:var(--text2); margin-bottom:6px; }
.stat-value { font-size:30px; font-weight:800; }
.stat-sub { font-size:13px; color:var(--text2); margin-top:4px; }
.table-wrap { border-radius:10px; border:1px solid var(--border); overflow:hidden; }
table { width:100%; border-collapse:collapse; font-size:14px; }
th { background:var(--bg2); padding:12px 16px; text-align:right; font-weight:700; color:var(--text2); font-size:13px; border-bottom:1px solid var(--border); white-space:nowrap; }
td { padding:12px 16px; border-bottom:1px solid var(--border); font-size:14px; }
tr.clickable { cursor:pointer; transition:.1s; }
tr.clickable:hover td { background:var(--hover); }
tr:last-child td { border-bottom:none; }
.tag { display:inline-flex; align-items:center; gap:5px; padding:4px 12px; border-radius:10px; font-size:13px; font-weight:600; }
.tag-green { background:#0d2b1a; color:#2ea043; }
.tag-blue { background:#152236; color:#5b9bd5; }
.tag-yellow { background:#251f0e; color:#d2991d; }
.tag-red { background:#2a0f0f; color:#f85149; }
.tag-gray { background:#222; color:#888; }
.dot { width:8px; height:8px; border-radius:50%; }
.dot-green{background:var(--green)}.dot-blue{background:var(--accent)}.dot-yellow{background:var(--yellow)}.dot-red{background:var(--red)}
.msg { background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:16px; margin-bottom:12px; }
.msg-header { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.msg-avatar { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; }
.msg-name { font-weight:700; font-size:15px; }
.msg-time { color:var(--text2); font-size:12px; }
.msg-body { font-size:14px; line-height:1.7; color:var(--ccc); }
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:200; align-items:center; justify-content:center; }
.modal-overlay.active { display:flex; }
.modal-box { background:var(--bg2); border:1px solid var(--border); border-radius:14px; padding:32px; width:90%; max-width:640px; max-height:85vh; overflow-y:auto; }
.modal-title { font-size:20px; font-weight:800; margin-bottom:24px; display:flex; align-items:center; gap:10px; }
.modal-close { margin-right:auto; background:none; border:none; color:var(--text2); font-size:24px; cursor:pointer; padding:4px 10px; border-radius:4px; }
.modal-close:hover { background:var(--hover); color:var(--text); }
.modal-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.modal-field label { display:block; font-size:13px; color:var(--text2); margin-bottom:6px; }
.modal-field .val { font-size:16px; font-weight:600; }
.modal-section { margin-top:20px; }
.modal-section h4 { font-size:14px; color:var(--text2); margin-bottom:10px; }
.detail-list { list-style:none; }
.detail-list li { padding:8px 0; border-bottom:1px solid var(--border); font-size:14px; display:flex; justify-content:space-between; }
.detail-list li:last-child { border:none; }
.detail-list .lbl { color:var(--text2); }
.detail-list .val { font-weight:600; }
input, select, textarea { background:var(--bg3); border:1px solid var(--border); color:var(--text); border-radius:5px; padding:10px 14px; font-size:14px; font-family:inherit; width:100%; }
textarea { min-height:60px; resize:vertical; }
.form-row { display:flex; gap:10px; margin-bottom:14px; }
.form-row > * { flex:1; }
.form-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:20px; }
.hidden { display:none; }
@media(max-width:768px) { .sidebar { display:none; } .modal-grid{grid-template-columns:1fr;} }
</style>
</head>

function statusTag(s){
  if(s.includes('פעיל')) return `<span class="tag tag-green"><span class="dot dot-green"></span>${s}</span>`;
  if(s==='מוכן') return `<span class="tag tag-blue"><span class="dot dot-blue"></span>${s}</span>`;
  if(s==='בתהליך') return `<span class="tag tag-green"><span class="dot dot-green"></span>${s}</span>`;
  if(s.includes('מחכה')) return `<span class="tag tag-yellow"><span class="dot dot-yellow"></span>${s}</span>`;
  if(s.includes('הושלם')) return `<span class="tag tag-gray">${s}</span>`;
  return `<span class="tag tag-gray">${s}</span>`;
}
function blockTag(b){
  if(b.includes('🔴')) return `<span class="tag tag-red">${b}</span>`;
  if(b.includes('🟡')) return `<span class="tag tag-yellow">${b}</span>`;
  if(b.includes('🟢')) return `<span class="tag tag-blue">${b}</span>`;
  return `<span class="tag tag-gray">${b}</span>`;
}

}
function addMessage(){

  messages.unshift({title:t,body:document.getElementById('msgBody').value,cat:document.getElementById('msgCat').value,time});

}

function switchView(view){
  currentView=view;

  document.getElementById('pageTitle').textContent=titles[view]||view;
  const renders={dashboard:renderDashboard,projects:renderProjects,bots:renderBots,tracks:renderTracks,messages:renderMessages,memory:renderMemory};
  document.getElementById('contentArea').innerHTML=renders[view]?renders[view]():'';
  document.querySelectorAll('.sidebar-item').forEach(el=>el.classList.remove('active'));
  const item=document.querySelector(`.sidebar-item[data-view="${view}"]`);if(item) item.classList.add('active');
}
function refresh(){switchView(currentView);}
function save(){
  localStorage.setItem('nb-bots',JSON.stringify(bots));
  localStorage.setItem('nb-tracks',JSON.stringify(tracks));
  localStorage.setItem('nb-projects',JSON.stringify(projects));
  localStorage.setItem('nb-messages',JSON.stringify(messages));
}
function load(){
  try{
    const b=localStorage.getItem('nb-bots');if(b) bots=JSON.parse(b);
    const t=localStorage.getItem('nb-tracks');if(t) tracks=JSON.parse(t);
    const p=localStorage.getItem('nb-projects');if(p) projects=JSON.parse(p);
    const m=localStorage.getItem('nb-messages');if(m) messages=JSON.parse(m);
  }catch(e){}
}
